name: Validación INTEGRASTOCK Multiempresa
on:
  push:
    branches: [multiempresa-desarrollo]
  workflow_dispatch:

permissions:
  contents: read

# Esta validación corre después de las correcciones y formato multiempresa.\n# Comprueba TypeScript, ESLint, Vite, Prettier y pruebas unitarias.

jobs:
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  build:
    name: Compilación Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  lint-multiempresa:
    name: ESLint de código multiempresa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Revisar archivos multiempresa
        run: |
          npx eslint src/lib/multiempresa src/components/multiempresa src/routes/_authenticated/route.tsx --rule "prettier/prettier: off"

  format-multiempresa:
    name: Formato Prettier multiempresa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Revisar formato sin modificar archivos
        run: npx prettier --check src/lib/multiempresa src/components/multiempresa src/routes/_authenticated/route.tsx
