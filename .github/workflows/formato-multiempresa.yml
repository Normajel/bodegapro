name: Formatear solo archivos multiempresa
on:
  push:
    branches: [multiempresa-desarrollo]
    paths:
      - .github/workflows/formato-multiempresa.yml
      - src/lib/multiempresa/**
      - src/components/multiempresa/**
      - src/routes/_authenticated/route.tsx
      - src/routes/auth.tsx
  workflow_dispatch:

permissions:
  contents: write

# Avoid multiple autoformat jobs pushing against the same development branch.
concurrency:
  group: multiempresa-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.ref == 'refs/heads/multiempresa-desarrollo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Aplicar Prettier a los archivos multiempresa
        run: |
          npx prettier --write \
            src/lib/multiempresa/database.types.ts \
            src/lib/multiempresa/tenant-catalog.ts \
            src/lib/multiempresa/tenant.test.ts \
            src/lib/multiempresa/company-context.ts \
            src/lib/multiempresa/company-context.test.ts \
            src/lib/multiempresa/receipt-validation.ts \
            src/lib/multiempresa/receipt-validation.test.ts \
            src/lib/multiempresa/receipt-batch.ts \
            src/lib/multiempresa/receipt-batch.test.ts \
            src/lib/multiempresa/receipt-service.ts \
            src/lib/multiempresa/approval-service.ts \
            src/lib/multiempresa/approval-service.test.ts \
            src/lib/multiempresa/new-order.ts \
            src/lib/multiempresa/new-order.test.ts \
            src/lib/multiempresa/new-order-service.ts \
            src/components/multiempresa/CompanySelector.tsx \
            src/components/multiempresa/LegacyMigrationGate.tsx \
            src/components/multiempresa/TenantInventoryPreview.tsx \
            src/components/multiempresa/TenantInventoryAdjustmentHistory.tsx \
            src/components/multiempresa/TenantMovementsPreview.tsx \
            src/components/multiempresa/TenantOrdersPreview.tsx \
            src/components/multiempresa/TenantReceiptPreview.tsx \
            src/components/multiempresa/TenantReceiptDraftForm.tsx \
            src/components/multiempresa/TenantSuppliersPreview.tsx \
            src/components/multiempresa/TenantServicesLedger.tsx \
            src/components/multiempresa/TenantNewOrderDraft.tsx \
            src/routes/_authenticated/route.tsx \
            src/routes/auth.tsx
      - name: Guardar solo los cambios de formato
        run: |
          git add -- \
            src/lib/multiempresa/database.types.ts \
            src/lib/multiempresa/tenant-catalog.ts \
            src/lib/multiempresa/tenant.test.ts \
            src/lib/multiempresa/company-context.ts \
            src/lib/multiempresa/company-context.test.ts \
            src/lib/multiempresa/receipt-validation.ts \
            src/lib/multiempresa/receipt-validation.test.ts \
            src/lib/multiempresa/receipt-batch.ts \
            src/lib/multiempresa/receipt-batch.test.ts \
            src/lib/multiempresa/receipt-service.ts \
            src/lib/multiempresa/approval-service.ts \
            src/lib/multiempresa/approval-service.test.ts \
            src/lib/multiempresa/new-order.ts \
            src/lib/multiempresa/new-order.test.ts \
            src/lib/multiempresa/new-order-service.ts \
            src/components/multiempresa/CompanySelector.tsx \
            src/components/multiempresa/LegacyMigrationGate.tsx \
            src/components/multiempresa/TenantInventoryPreview.tsx \
            src/components/multiempresa/TenantInventoryAdjustmentHistory.tsx \
            src/components/multiempresa/TenantMovementsPreview.tsx \
            src/components/multiempresa/TenantOrdersPreview.tsx \
            src/components/multiempresa/TenantReceiptPreview.tsx \
            src/components/multiempresa/TenantReceiptDraftForm.tsx \
            src/components/multiempresa/TenantSuppliersPreview.tsx \
            src/components/multiempresa/TenantServicesLedger.tsx \
            src/components/multiempresa/TenantNewOrderDraft.tsx \
            src/routes/_authenticated/route.tsx \
            src/routes/auth.tsx
          if git diff --cached --quiet; then
            echo "Sin cambios de formato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: aplicar Prettier solo a archivos multiempresa"
          # The branch can move while formatting is running.
          git fetch origin multiempresa-desarrollo
          git rebase origin/multiempresa-desarrollo
          git push origin HEAD:multiempresa-desarrollo
